<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 500" width="1560" height="500" role="img" aria-label="Agent teams: a lead session, a shared task list and five teammates"><title>Agent teams: a lead session, a shared task list and five teammates</title><defs><marker id="a5F6368" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F6368"/></marker><marker id="aE37400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E37400"/></marker></defs><rect width="1560" height="500" fill="#fff"/><rect x="250" y="40" width="440" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="250" y="50" width="5" height="52" rx="2.5" fill="#1A73E8"/><text x="272" y="74" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Lead session</text><text x="272" y="97" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">You and Claude Code. Delegates and coordinates.</text><rect x="870" y="40" width="440" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="870" y="50" width="5" height="52" rx="2.5" fill="#E37400"/><text x="892" y="74" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">Shared task list</text><text x="892" y="97" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Every teammate claims and updates tasks here</text><path d="M690 68 L870 68" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#a5F6368)"/><path d="M870 88 L690 88" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#a5F6368)"/><rect x="20" y="250" width="1520" height="205" rx="20" fill="#F7F8F9" stroke="#E3E3E6" stroke-width="1.5"/><text x="42" y="282" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#5F6368"></text><text x="42" y="438" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#5F6368">TEAMMATES · INDEPENDENT SESSIONS RUNNING IN PARALLEL</text><rect x="40" y="280" width="270" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="40" y="290" width="5" height="52" rx="2.5" fill="#188038"/><text x="62" y="314" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">feature-builder</text><text x="62" y="337" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Implements the change</text><rect x="343" y="280" width="270" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="343" y="290" width="5" height="52" rx="2.5" fill="#188038"/><text x="365" y="314" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">test-writer</text><text x="365" y="337" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Adds tests</text><rect x="646" y="280" width="270" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="646" y="290" width="5" height="52" rx="2.5" fill="#188038"/><text x="668" y="314" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">test-runner</text><text x="668" y="337" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Build, lint, typecheck</text><rect x="949" y="280" width="270" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="949" y="290" width="5" height="52" rx="2.5" fill="#D93025"/><text x="971" y="314" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">code-reviewer</text><text x="971" y="337" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">Quality gate</text><rect x="1252" y="280" width="270" height="72" rx="12" fill="#fff" stroke="#E3E3E6" stroke-width="1.5"/><rect x="1252" y="290" width="5" height="52" rx="2.5" fill="#D93025"/><text x="1274" y="314" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1B1B1F">compliance-reviewer</text><text x="1274" y="337" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="14" fill="#5F6368">House rules gate</text><path d="M1090 112 L1090 196 M175.0 196 L1387.0 196" fill="none" stroke="#E37400" stroke-width="2"/><path d="M175.0 196 L175.0 280" fill="none" stroke="#E37400" stroke-width="2" marker-end="url(#aE37400)"/><path d="M478.0 196 L478.0 280" fill="none" stroke="#E37400" stroke-width="2" marker-end="url(#aE37400)"/><path d="M781.0 196 L781.0 280" fill="none" stroke="#E37400" stroke-width="2" marker-end="url(#aE37400)"/><path d="M1084.0 196 L1084.0 280" fill="none" stroke="#E37400" stroke-width="2" marker-end="url(#aE37400)"/><path d="M1387.0 196 L1387.0 280" fill="none" stroke="#E37400" stroke-width="2" marker-end="url(#aE37400)"/><text x="1102" y="160" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="12.5" fill="#E37400">claim and update</text><path d="M310 316 L343 316" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a5F6368)"/><path d="M613 316 L646 316" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a5F6368)"/><path d="M1219 316 L1252 316" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a5F6368)"/><path d="M175.0 352 L175.0 384 L1084.0 384 L1084.0 352" fill="none" stroke="#5F6368" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a5F6368)"/><rect x="554.7" y="372" width="149.6" height="24" rx="12" fill="#fff" stroke="#5F6368" stroke-opacity=".35"/><text x="629.5" y="388.5" text-anchor="middle" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5F6368">hand off when done</text><text x="40" y="492" font-family="'Google Sans Flex', 'Google Sans', Arial, sans-serif" font-size="15" fill="#5F6368">Dashed lines are messages between teammates. The lead doesn't micromanage.</text></svg>